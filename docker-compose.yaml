services:
  mongodb:
    image: mongo
    container_name: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
    volumes:
      - mongo_data:/data/db
    networks:
      - private_net  # ✅ Reference global network
    ports:
      - "27017:27017"  # ✅ Enables access from your host for Compass
  
  auth_service:
    build: ./services/auth_service
    container_name: auth_service
    depends_on:
      - mongodb
    ports:
      - "8000:8000"
      - "8002:8002" # prometheus server's port
    environment:
      - MONGO_URI=mongodb://admin:secret@mongodb:27017
    networks:
      - private_net  # ✅ Same network for internal DNS

  # =====================
  # Prometheus Monitoring
  # =====================
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - auth_service

  # ===========================
  # Monitoring API (Flask/FastAPI)
  # ===========================
  # monitoring_api:
  #   build: ./monitoring_app/backend
  #   ports:
  #     - "7000:7000"
